name: Android engine checks

on:
  push:
    branches: [main, 'arena/*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compile, test, lint and package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee verification.log
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-verification
          path: |
            verification.log
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - name: Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S-Engine-Studio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

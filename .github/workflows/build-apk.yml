name: Build S Engine Ultra APK

on:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK - Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show project structure
        run: |
          echo "=== S Engine 6.1.2 Ultra Edition ==="
          cat app/build.gradle.kts | grep -E "versionCode|versionName|ENGINE_VERSION"
          echo "Total Kotlin files: $(find app/src/main/java -name '*.kt' | wc -l)"

      - name: Build Debug APK - S Engine 6.1.2 Ultra
        id: build_debug
        run: |
          echo "Starting Gradle build..."
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          ls -lh app/build/outputs/apk/debug/ || echo "No debug APK dir"
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"
          echo "=== Last 1000 lines ===" > build-failure-summary.log
          tail -n 1000 gradle-build.log >> build-failure-summary.log
          echo "" >> build-failure-summary.log
          echo "=== Errors ===" >> build-failure-summary.log
          grep -i -A5 -B5 "error\|FAILED\|Unresolved\|Cannot\|e:" gradle-build.log | tail -n 1000 >> build-failure-summary.log || true
          cat build-failure-summary.log
          echo "### Build Failure - S Engine Ultra 6.1.2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build-failure-summary.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Gradle build failed with exit $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

      - name: Build Release APK (signed with debug key)
        if: success()
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-release.log || echo "Release build failed but debug ok"
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S-Engine-Ultra-6.1.2-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            gradle-build.log
            gradle-release.log
            build-failure-summary.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-ultra
          path: |
            gradle-build.log
            gradle-release.log
            build-failure-summary.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Create Gist with failure log for debugging
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating Gist with build failure log..."
          # Prepare JSON payload with log truncated to 100KB
          LOG_CONTENT=$(cat build-failure-summary.log | head -c 90000)
          # Escape for JSON using python
          python3 << PY > gist_payload.json
          import json, os
          log_path = "build-failure-summary.log"
          try:
              with open(log_path, 'r') as f:
                  content = f.read()[:90000]
          except:
              content = "Failed to read log"
          payload = {
              "description": "S Engine Ultra 6.1.2 Build Failure Log - Run ${{ github.run_id }}",
              "public": False,
              "files": {
                  "build-failure-summary.log": {"content": content},
                  "README.md": {"content": "Build failure for S Engine 6.1.2 Ultra Edition\nRun ID: ${{ github.run_id }}\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\n"}
              }
          }
          print(json.dumps(payload))
          PY
          cat gist_payload.json | head -c 500
          echo ""
          # Try to create gist via API
          curl -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" --data @gist_payload.json https://api.github.com/gists > gist_response.json || echo "Gist creation failed"
          cat gist_response.json | head -c 1000
          echo ""
          # Also try to create issue with log
          echo "Trying to create issue with log..."
          python3 << PY > issue_payload.json
          import json
          log_path = "build-failure-summary.log"
          try:
              with open(log_path, 'r') as f:
                  content = f.read()[:60000]
          except:
              content = "Failed to read log"
          body = f"Build failure for S Engine 6.1.2 Ultra\nRun ID: ${{{{ github.run_id }}}}\nBranch: ${{{{ github.ref }}}}\nCommit: ${{{{ github.sha }}}}\n\n```\n{content[:50000]}\n```\n"
          payload = {
              "title": "Build Failure Log - Run ${{ github.run_id }} - Ultra 6.1.2",
              "body": body,
              "labels": ["bug", "ci"]
          }
          print(json.dumps(payload))
          PY
          curl -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" --data @issue_payload.json https://api.github.com/repos/${{ github.repository }}/issues > issue_response.json || echo "Issue creation failed"
          cat issue_response.json | head -c 1000

      - name: Commit failure log to repo for debugging [skip ci]
        if: failure()
        run: |
          echo "Committing failure log for debugging"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || echo "Pull rebase failed, continuing"
          echo "# Build Failure Log - Run ${{ github.run_id }}" > BUILD_FAILURE_LOG.md
          echo "" >> BUILD_FAILURE_LOG.md
          echo "Branch: ${{ github.ref }}" >> BUILD_FAILURE_LOG.md
          echo "Commit: ${{ github.sha }}" >> BUILD_FAILURE_LOG.md
          echo "Run ID: ${{ github.run_id }}" >> BUILD_FAILURE_LOG.md
          echo "Date: $(date)" >> BUILD_FAILURE_LOG.md
          echo "" >> BUILD_FAILURE_LOG.md
          echo '```' >> BUILD_FAILURE_LOG.md
          cat build-failure-summary.log >> BUILD_FAILURE_LOG.md
          echo '```' >> BUILD_FAILURE_LOG.md
          git add BUILD_FAILURE_LOG.md
          git commit -m "CI: Add build failure log for run ${{ github.run_id }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
          git push --force-with-lease origin HEAD:${{ github.ref_name }} || echo "Push failed even with force"

      - name: Show Engine Version and APK Info
        if: always()
        run: |
          echo "S Engine Version: 6.1.2 Ultra Edition [Ultra] API:612"
          echo "Systems: 96+ Components: 250+ Templates: 36 API: 400+"
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"

name: Build APK

on:
  push:
    branches: [ arena/1772be8b-assets2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform + build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (debug-key signed, installable)
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

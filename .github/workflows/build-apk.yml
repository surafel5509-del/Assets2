name: Build S Engine Ultra APK

on:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK - Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --list | head -100 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK - S Engine 6.1.2 Ultra
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "=== Build completed ==="
          ls -lh app/build/outputs/apk/debug/ || true
          find app/build/outputs -name "*.apk" -type f | xargs ls -lh || true

      - name: Build Release APK (signed with debug key)
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon || echo "Release build failed, debug is ok"
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-Engine-Ultra-6.1.2-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show Engine Version
        run: |
          echo "S Engine Version: 6.1.2 Ultra Edition [Ultra] API:612"
          echo "Systems: 96+ Components: 250+ Templates: 36 API: 400+"
          cat app/build.gradle.kts | grep -E "versionCode|versionName|ENGINE_VERSION|ENGINE_API"
          echo "APK files:"
          find . -name "*.apk" -type f -exec ls -lh {} \;

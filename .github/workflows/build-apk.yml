name: Build S Engine 3.0.0 APK

on:
  push:
    branches: [ arena/94ba1396-assets2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Professional Studio Edition APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK root: $SDK"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing cmdline-tools..."
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-3.0.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (debug-key signed, installable)
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-3.0.0-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-final-apk:
    name: Publish final APKs to release/
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]'))
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: SEngine-3.0.0-debug-apk
          path: release/debug

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: SEngine-3.0.0-release-apk
          path: release/release

      - name: Stage final APK deliverables
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$(find release/debug -name '*.apk' | head -1)" release/SEngine-3.0.0-debug.apk
          cp "$(find release/release -name '*.apk' | head -1)" release/SEngine-3.0.0-release.apk
          rm -rf release/debug release/release
          sha256sum release/SEngine-3.0.0-*.apk | tee release/SHA256SUMS.txt
          ls -lh release/SEngine-3.0.0-*.apk

      - name: Verify APK structure
        run: |
          set -euo pipefail
          for f in release/SEngine-3.0.0-*.apk; do
            unzip -t "$f" >/dev/null
            for entry in classes.dex AndroidManifest.xml resources.arsc; do
              unzip -Z1 "$f" | grep -qx "$entry"
            done
          done

      - name: Commit final APKs to the active branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore release/SEngine-3.0.0-debug.apk release/SEngine-3.0.0-release.apk release/SHA256SUMS.txt release/README.md
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
            exit 0
          fi
          git commit -m "Add final S Engine 3.0.0 APK deliverables [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Build S Engine Ultra APK

on:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write
  gists: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK - Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show project structure
        run: |
          echo "=== S Engine 6.1.2 Ultra Edition ==="
          cat app/build.gradle.kts | grep -E "versionCode|versionName|ENGINE_VERSION"
          echo "Total Kotlin files: $(find app/src/main/java -name '*.kt' | wc -l)"

      - name: Build Debug APK - S Engine 6.1.2 Ultra
        id: build_debug
        run: |
          echo "Starting Gradle build..."
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          ls -lh app/build/outputs/apk/debug/ || echo "No debug APK dir"
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"
          echo "=== Last 1000 lines ===" > build-failure-summary.log
          tail -n 1000 gradle-build.log >> build-failure-summary.log
          echo "" >> build-failure-summary.log
          echo "=== Errors ===" >> build-failure-summary.log
          grep -i -A5 -B5 "error\|FAILED\|Unresolved\|Cannot" gradle-build.log | tail -n 1000 >> build-failure-summary.log || true
          cat build-failure-summary.log
          echo "### Build Failure - S Engine Ultra 6.1.2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: $GITHUB_RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build-failure-summary.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Gradle build failed with exit $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

      - name: Build Release APK (signed with debug key)
        if: success()
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-release.log || echo "Release build failed but debug ok"
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S-Engine-Ultra-6.1.2-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            gradle-build.log
            gradle-release.log
            build-failure-summary.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-ultra
          path: |
            gradle-build.log
            gradle-release.log
            build-failure-summary.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Create Gist with failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Creating Gist with build failure log..."
          python3 << 'PY'
          import json, os
          run_id = os.environ.get('RUN_ID', 'unknown')
          ref_name = os.environ.get('REF_NAME', 'unknown')
          repo = os.environ.get('REPO', 'unknown')
          log_path = "build-failure-summary.log"
          try:
              with open(log_path, 'r') as f:
                  content = f.read()[:90000]
          except:
              content = "Failed to read log"
          payload = {
              "description": f"S Engine Ultra 6.1.2 Build Failure Log - Run {run_id} - {ref_name}",
              "public": False,
              "files": {
                  "build-failure-summary.log": {"content": content},
                  "README.md": {"content": f"Build failure for S Engine 6.1.2 Ultra Edition\nRun ID: {run_id}\nBranch: {ref_name}\nRepo: {repo}\n"}
              }
          }
          with open('gist_payload.json', 'w') as out:
              json.dump(payload, out)
          print("Gist payload created")
          PY
          curl -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" --data @gist_payload.json https://api.github.com/gists > gist_response.json || echo "Gist creation failed"
          cat gist_response.json | head -c 2000
          echo ""

      - name: Show Engine Version and APK Info
        if: always()
        run: |
          echo "S Engine Version: 6.1.2 Ultra Edition [Ultra] API:612"
          echo "Systems: 96+ Components: 250+ Templates: 36 API: 400+"
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"

name: Build S Engine Ultra APK

on:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK - Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list | grep -E "platforms;android-34|build-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show project structure
        run: |
          echo "=== S Engine 6.1.2 Ultra Edition ==="
          cat app/build.gradle.kts | grep -E "versionCode|versionName|ENGINE_VERSION"
          ls -la app/src/main/java/com/sengine/engine/core/ | tail -20
          ls -la app/src/main/java/com/sengine/engine/render/ | tail -20
          echo "Total Kotlin files: $(find app/src/main/java -name '*.kt' | wc -l)"

      - name: Build Debug APK - S Engine 6.1.2 Ultra
        id: build_debug
        run: |
          echo "Starting Gradle build..."
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          echo "=== APK outputs ==="
          ls -lh app/build/outputs/apk/debug/ || echo "No debug APK dir"
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED - Last 500 lines ==="
            tail -n 500 gradle-build.log || true
            echo "=== Searching for errors ==="
            grep -i -E "error|exception|failed" gradle-build.log | tail -n 100 || true
            exit $BUILD_EXIT
          fi

      - name: Build Release APK (signed with debug key)
        if: success()
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-release.log || echo "Release build failed but debug ok"
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S-Engine-Ultra-6.1.2-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            gradle-build.log
            gradle-release.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-ultra
          path: |
            gradle-build.log
            gradle-release.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Show Engine Version and APK Info
        if: always()
        run: |
          echo "S Engine Version: 6.1.2 Ultra Edition [Ultra] API:612"
          echo "Systems: 96+ Components: 250+ Templates: 36 API: 400+"
          echo "APK files:"
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"
          echo "Build logs:"
          ls -lh *.log || true
          if [ -f gradle-build.log ]; then
            echo "=== Tail of build log ==="
            tail -n 100 gradle-build.log
          fi

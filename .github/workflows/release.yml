name: Release

# Builds a downloadable APK for a version tag and publishes it as a GitHub
# Release.  Reuses ci.yml so a release cannot ship an APK that skipped the
# engine checks or the unit tests.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist, e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  apk:
    name: Build release APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK after the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          mkdir -p dist
          cp "$src" "dist/SEngine-${tag}.apk"
          ls -lh dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: SEngine-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

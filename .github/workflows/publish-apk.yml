name: Publish final v3.0.0 APKs

# Manual release path. The normal Build S Engine 3.0.0 APK workflow uploads
# artifacts; this one additionally commits the two verified APKs to release/
# so the final deliverable is available directly from the repository.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Build and publish final APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK root: $SDK"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Stage final APK deliverables
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SEngine-3.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release/SEngine-3.0.0-release.apk
          sha256sum release/SEngine-3.0.0-*.apk | tee release/SHA256SUMS.txt
          ls -lh release/SEngine-3.0.0-*.apk

      - name: Verify APK structure
        run: |
          set -euo pipefail
          for f in release/SEngine-3.0.0-*.apk; do
            unzip -t "$f" >/dev/null
            for entry in classes.dex AndroidManifest.xml resources.arsc; do
              unzip -Z1 "$f" | grep -qx "$entry"
            done
          done

      - name: Commit final APKs to the active branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore release/SEngine-3.0.0-debug.apk release/SEngine-3.0.0-release.apk release/SHA256SUMS.txt release/README.md
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
            exit 0
          fi
          git commit -m "Add final S Engine 3.0.0 APK deliverables [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
